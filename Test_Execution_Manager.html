<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10233f">
  <title>Test Execution Manager</title>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#17263d;background:#f4f7fb;font-synthesis:none;font-size:14px}
    *{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select,textarea{font:inherit}
    button{border:0;border-radius:7px;padding:9px 13px;background:#1769d2;color:#fff;cursor:pointer;font-weight:600}
    button:hover{background:#0e55b5}button.secondary{color:#25415f;background:#e9eff7}button.secondary:hover{background:#dce7f3}
    button.danger{background:#c33c4b}button.danger:hover{background:#a92b39}button:disabled{opacity:.55;cursor:not-allowed}
    input,select,textarea{border:1px solid #d5deea;border-radius:6px;padding:9px;background:#fff;color:#17263d}
    input:focus,select:focus,textarea:focus{outline:2px solid #a9ccf8;border-color:#5092e5}textarea{resize:vertical;min-height:75px}
    .topbar{height:66px;background:#10233f;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 25px;gap:15px}
    .brand{font-size:18px;font-weight:700;letter-spacing:.2px}.brand span{color:#6eb2ff}.top-actions{display:flex;align-items:center;gap:10px}
    .top-actions select{max-width:230px}.layout{display:flex;min-height:calc(100vh - 66px)}
    aside{width:218px;background:#fff;border-right:1px solid #e3eaf2;padding:19px 12px;flex-shrink:0}
    .nav{display:grid;gap:5px}.nav button{background:transparent;color:#52647a;text-align:left;font-weight:600}.nav button.active,.nav button:hover{background:#eaf3ff;color:#145db5}
    main{padding:27px clamp(16px,3vw,38px);width:min(1500px,100%);margin:0 auto}
    .main-wrap{flex:1;min-width:0}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}
    h1{font-size:25px;margin:0 0 6px;color:#142844}h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;margin:0 0 10px}
    p.subtle,.subtle{color:#718096;margin:0}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .card{background:#fff;border:1px solid #e4eaf2;border-radius:11px;padding:18px;box-shadow:0 3px 12px #16375a0a;margin-bottom:16px}
    .stats{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e4eaf2;border-radius:10px;padding:15px}
    .stat small{display:block;color:#718096;margin-bottom:7px}.stat strong{font-size:23px}.blue{color:#1769d2}.green{color:#218653}.red{color:#c33c4b}.amber{color:#b77713}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar input[type=search]{min-width:210px}
    .table-wrap{overflow:auto;border:1px solid #e6ebf2;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:780px;background:#fff}
    th,td{padding:11px 12px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top;max-width:310px;overflow-wrap:anywhere}
    th{background:#f7f9fc;color:#52647a;font-size:12px;position:sticky;top:0;z-index:1}tr:last-child td{border-bottom:0}
    .pill{display:inline-block;padding:4px 8px;border-radius:30px;font-size:11px;font-weight:700;background:#edf1f5;color:#607087}
    .pill.Pass{background:#e5f5ec;color:#218653}.pill.Fail{background:#ffeaec;color:#b53242}.pill.Pending{background:#fff4db;color:#a86a00}
    .mark-pass{background:#218653}.mark-pass:hover{background:#176c43}.mark-fail{background:#c33c4b}.mark-fail:hover{background:#a92b39}
    .actions-icon{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:190px}
    button.icon-button{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;flex:0 0 auto}
    button.icon-button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    button.icon-button.secondary{background:#e9eff7;color:#25415f}button.icon-button.secondary:hover{background:#dce7f3}
    button.icon-button.mark-pass{background:#218653;color:#fff}button.icon-button.mark-fail{background:#c33c4b;color:#fff}
    button.icon-button.archive-action{background:#fff0f0;color:#a52e3b}button.icon-button.archive-action:hover{background:#ffdddd}
    .paste-zone{border:1px dashed #91a9c5;border-radius:7px;padding:10px;color:#52647a;background:#f7faff;cursor:text;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .paste-zone:focus,.paste-zone.dragging{outline:2px solid #a9ccf8;border-color:#5092e5;background:#edf5ff}
    .thumbs .evidence-preview{position:relative;display:grid;gap:3px;max-width:112px}.thumbs .evidence-preview img{width:100px;height:72px}
    .evidence-preview button{position:absolute;right:4px;top:3px;padding:2px 6px;background:#a52e3b;font-size:11px}
    .inline-case-row td{background:#fbfdff}.inline-case-row input,.inline-case-row select,.inline-case-row textarea{width:100%;min-width:100px;padding:7px;font-size:13px}.inline-case-row textarea{min-height:44px}
    .paste-hint{grid-column:1/-1;color:#52647a;background:#f3f7fc;padding:9px 11px;border-radius:6px}
    .empty{color:#718096;text-align:center;padding:35px 12px}.progress{height:8px;border-radius:20px;background:#e7edf5;overflow:hidden}.progress i{display:block;height:100%;background:#2376dc}
    .field-row,.sheet-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf1f5}.field-row:last-child,.sheet-row:last-child{border-bottom:0}
    .field-row .grow,.sheet-row .grow{flex:1}.field-row small,.sheet-row small{color:#718096}.field-row select{max-width:145px}.sheet-columns{padding-left:22px;border-bottom:1px solid #edf1f5}
    .notice{border-radius:8px;padding:10px 12px;background:#edf5ff;color:#255685;margin:10px 0}.notice.error{background:#fff0f0;color:#a52e3b}
    .inline-form{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:9px;margin:12px 0}.inline-form .span2{grid-column:span 2}
    .checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:6px}
    dialog{border:0;border-radius:12px;box-shadow:0 14px 60px #10233f55;width:min(760px,calc(100% - 24px));padding:0;color:#17263d}
    dialog::backdrop{background:#10233f66}.dialog-head{padding:18px 22px;border-bottom:1px solid #e9edf3;display:flex;justify-content:space-between}
    .dialog-body{padding:18px 22px;max-height:70vh;overflow:auto}.dialog-foot{padding:14px 22px;border-top:1px solid #e9edf3;display:flex;justify-content:flex-end;gap:8px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid label{display:grid;gap:5px;color:#52647a;font-size:12px;font-weight:600}.form-grid .wide{grid-column:1/-1}
    .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:84px;height:68px;object-fit:cover;border:1px solid #dce4ef;border-radius:6px}
    #toast{position:fixed;right:20px;bottom:20px;padding:12px 16px;border-radius:8px;background:#173d69;color:#fff;box-shadow:0 7px 25px #10233f30;display:none;max-width:min(420px,calc(100% - 40px));z-index:9}
    .muted{color:#718096}.right{margin-left:auto}.section-label{color:#718096;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:19px 0 8px}
    .evidence-link{color:#1769d2;text-decoration:underline;cursor:pointer;background:none;padding:0;font-weight:500}
    @media(max-width:850px){.layout{display:block}aside{width:auto;padding:7px 12px;border-right:0;border-bottom:1px solid #e3eaf2}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}main{padding:18px 14px}.stats{grid-template-columns:repeat(2,minmax(120px,1fr))}}
    @media(max-width:560px){.topbar{padding:0 12px}.brand{font-size:15px}.top-actions select{max-width:135px}.top-actions button{padding:8px}.inline-form,.form-grid{grid-template-columns:1fr}.inline-form .span2{grid-column:auto}.page-head{display:block}.page-head>.actions{margin-top:12px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span>Test</span> Execution Manager</div>
    <div class="top-actions">
      <select id="projectSelect" aria-label="Current project"></select>
      <button class="secondary" id="newProject">New project</button>
    </div>
  </header>
  <div class="layout">
    <aside><nav class="nav" id="nav">
      <button data-page="workspace" class="active">Test cases</button>
      <button data-page="dashboard">Dashboard</button>
      <button data-page="fields">Field manager</button>
      <button data-page="worksheets">Worksheet manager</button>
      <button data-page="history">Execution history</button>
      <button data-page="settings">Project settings</button>
    </nav></aside>
    <div class="main-wrap"><main id="app"></main></div>
  </div>
  <dialog id="caseDialog">
    <form id="caseForm">
      <div class="dialog-head"><h2 id="caseTitle">Test case</h2><button type="button" class="secondary" data-close>Close</button></div>
      <div class="dialog-body"><div class="form-grid" id="caseFields"></div></div>
      <div class="dialog-foot"><button type="button" class="secondary" data-close>Cancel</button><button type="submit">Save test case</button></div>
    </form>
  </dialog>
  <dialog id="executeDialog">
    <form id="executeForm">
      <div class="dialog-head"><h2 id="executeTitle">Execute test case</h2><button type="button" class="secondary" data-close>Close</button></div>
      <div class="dialog-body">
        <div id="executionContext" class="notice"></div>
        <div class="form-grid">
          <label class="wide">Actual result<textarea name="actual" required></textarea></label>
          <label>Status<select name="status" required><option>Pass</option><option>Fail</option></select></label>
          <label>Evidence screenshots<input name="screenshots" type="file" accept="image/*" multiple><small>Upload images, or click the paste area below and press Ctrl+V.</small></label>
          <div class="wide paste-zone" data-paste-zone tabindex="0" contenteditable="true" role="textbox" aria-label="Paste screenshots">Click here, then press Ctrl+V to paste a screenshot, or use the clipboard button.</div>
          <button type="button" class="secondary" data-read-clipboard>Paste from clipboard</button>
          <label class="wide">Execution comments<textarea name="comments"></textarea></label>
          <div class="wide"><div class="thumbs" id="preview"></div></div>
        </div>
      </div>
      <div class="dialog-foot"><button type="button" class="secondary" data-close>Cancel</button><button type="submit">Save attempt</button></div>
    </form>
  </dialog>
  <dialog id="inputDialog">
    <form id="inputForm">
      <div class="dialog-head"><h2 id="inputTitle">Enter value</h2><button type="button" class="secondary" data-input-cancel>Close</button></div>
      <div class="dialog-body"><label id="inputLabel" style="display:grid;gap:8px"></label></div>
      <div class="dialog-foot"><button type="button" class="secondary" data-input-cancel>Cancel</button><button type="submit">Continue</button></div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script>
  (() => {
    "use strict";
    const DB_NAME = "TestExecutionManager", DB_VERSION = 1;
    const STORE_NAMES = ["projects","cases","fields","worksheets","rounds","attempts","evidence","evidenceBinary","settings"];
    const $ = (s, root=document) => root.querySelector(s), $$ = (s, root=document) => [...root.querySelectorAll(s)];
    const uid = () => crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2);
    const ICONS={
      edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',
      pass:'<path d="m5 12 4 4L19 6"/>',
      fail:'<path d="m6 6 12 12M18 6 6 18"/>',
      copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
      archive:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/>',
      execute:'<path d="m8 5 12 7-12 7z"/>',
      restore:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'
    };
    function iconButton(icon,label,classes,id,extra="") {
      return `<button type="button" class="icon-button ${classes}" data-id="${escapeHtml(id)}" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}" ${extra}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[icon]}</svg></button>`;
    }
    const safeText = value => String(value ?? "");
    const escapeHtml = value => safeText(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    let db, projectId, page = "workspace", toastTimer, selectedCases = new Set(), activeAttemptFiles = [], activePendingEvidence=[], executionPreviewUrls = [], activeCaseEvidenceAdder=null, activeExecutionEvidenceAdder=null, showArchivedCases=false;
    const defaultFields = [
      ["Test Case ID","text",true],["Description","longtext",true],["Expected Result","longtext",false],
      ["Actual Result","longtext",false],["Status","dropdown",false],["Screenshot","text",false],["Comments","longtext",false]
    ];
    function openDB() {
      return new Promise((resolve,reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const d = request.result;
          for (const name of STORE_NAMES) {
            if (!d.objectStoreNames.contains(name)) {
              const store = d.createObjectStore(name,{keyPath:"id"});
              store.createIndex("projectId","projectId",{unique:false});
            }
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Could not open browser storage."));
        request.onblocked = () => reject(new Error("Storage upgrade is blocked by another open application tab."));
      });
    }
    function req(request) { return new Promise((resolve,reject) => { request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error); }); }
    async function all(storeName) { return req(db.transaction(storeName,"readonly").objectStore(storeName).getAll()); }
    async function byProject(storeName, id=projectId) { return req(db.transaction(storeName,"readonly").objectStore(storeName).index("projectId").getAll(id)); }
    async function put(storeName, value) { return req(db.transaction(storeName,"readwrite").objectStore(storeName).put(value)); }
    function saveExecution(attempt,evidenceRows,caseRecord) {
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(["attempts","evidence","evidenceBinary","cases"],"readwrite");
        tx.objectStore("attempts").put(attempt);tx.objectStore("cases").put(caseRecord);
        for(const row of evidenceRows){tx.objectStore("evidence").put(row.metadata);tx.objectStore("evidenceBinary").put(row.binary);}
        tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error("Could not save execution evidence."));tx.onabort=()=>reject(tx.error||new Error("Execution save was cancelled."));
      });
    }
    function saveCaseEvidence(caseRecord,evidenceRows) {
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(["cases","evidence","evidenceBinary"],"readwrite");
        tx.objectStore("cases").put(caseRecord);
        for(const row of evidenceRows){tx.objectStore("evidence").put(row.metadata);tx.objectStore("evidenceBinary").put(row.binary);}
        tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error("Could not save test case screenshots."));tx.onabort=()=>reject(tx.error||new Error("Test case save was cancelled."));
      });
    }
    async function remove(storeName, id) { return req(db.transaction(storeName,"readwrite").objectStore(storeName).delete(id)); }
    async function removeProjectRecords(storeName,id) {
      const tx=db.transaction(storeName,"readwrite"), idx=tx.objectStore(storeName).index("projectId"), cursor=idx.openCursor(id);
      await new Promise((resolve,reject)=>{cursor.onsuccess=()=>{const c=cursor.result;if(c){c.delete();c.continue();}else resolve();};cursor.onerror=()=>reject(cursor.error);});
    }
    function notify(message, error=false) {
      const el=$("#toast"); el.textContent=message; el.style.background=error?"#a52e3b":"#173d69"; el.style.display="block";
      clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.display="none",4200);
    }
    function askInput(title,label,{value="",options=null,required=true}={}) {
      return new Promise(resolve=>{
        const dialog=$("#inputDialog"),form=$("#inputForm"),holder=$("#inputLabel");
        $("#inputTitle").textContent=title;
        const submitButton=$('button[type="submit"]',form);submitButton.textContent="Continue";submitButton.classList.remove("danger");
        holder.innerHTML=`${escapeHtml(label)}${options?`<select name="answer" ${required?"required":""}>${options.map(o=>`<option value="${escapeHtml(o.value)}" ${o.value===value?"selected":""}>${escapeHtml(o.label)}</option>`).join("")}</select>`:`<input name="answer" value="${escapeHtml(value)}" ${required?"required":""}>`}`;
        let settled=false,submit,cancel,onCancel;
        const cancelButtons=$$("[data-input-cancel]",form);
        const finish=result=>{if(settled)return;settled=true;form.removeEventListener("submit",submit);cancelButtons.forEach(button=>button.removeEventListener("click",cancel));dialog.removeEventListener("cancel",onCancel);dialog.close();resolve(result);};
        cancel=()=>finish(null);
        submit=e=>{e.preventDefault();finish(form.elements.answer.value);};
        onCancel=cancel;
        form.addEventListener("submit",submit);cancelButtons.forEach(button=>button.addEventListener("click",cancel));
        dialog.addEventListener("cancel",onCancel);
        dialog.showModal();form.elements.answer.focus();
      });
    }
    function askConfirm(message,{danger=false,confirmText="Confirm"}={}) {
      return new Promise(resolve=>{
        const dialog=$("#inputDialog"),form=$("#inputForm"),holder=$("#inputLabel");
        $("#inputTitle").textContent="Please confirm";
        holder.innerHTML=`<p>${escapeHtml(message)}</p>`;
        const submitButton=$('button[type="submit"]',form);submitButton.textContent=confirmText;submitButton.classList.toggle("danger",danger);
        const cancelButtons=$$("[data-input-cancel]",form);
        let settled=false,submit,cancel,onCancel;
        const finish=result=>{if(settled)return;settled=true;form.removeEventListener("submit",submit);cancelButtons.forEach(button=>button.removeEventListener("click",cancel));dialog.removeEventListener("cancel",onCancel);dialog.close();resolve(result);};
        submit=e=>{e.preventDefault();finish(true);};cancel=()=>finish(false);onCancel=cancel;
        form.addEventListener("submit",submit);cancelButtons.forEach(button=>button.addEventListener("click",cancel));
        dialog.addEventListener("cancel",onCancel);dialog.showModal();
      });
    }
    function fail(error) {
      console.error(error);
      const message = error && error.name === "QuotaExceededError" ? "Browser storage is full. Export a project backup or remove unused evidence, then try again." : (error?.message || "The operation could not be completed.");
      notify(message,true);
    }
    const dateTime = value => value ? new Date(value).toLocaleString() : "";
    const statusPill = status => `<span class="pill ${escapeHtml(status||"Pending")}">${escapeHtml(status||"Pending")}</span>`;
    async function seed() {
      const existing=await all("projects");
      if(existing.length) { projectId=existing[0].id; return; }
      const p={id:uid(),name:"My QA Project",createdAt:Date.now(),archived:false};
      await put("projects",p); projectId=p.id;
      for(const [index,[label,type,required]] of defaultFields.entries()) await put("fields",{id:uid(),projectId,label,type,required,visible:true,archived:false,options:type==="dropdown"&&label==="Status"?["Pending","Pass","Fail"]:[],system:true,order:index});
      const fields=(await byProject("fields")).sort((a,b)=>a.order-b.order);
      await put("worksheets",{id:uid(),projectId,name:"Test Case Master",order:0,visible:true,columns:fields.filter(f=>!f.archived).map((f,i)=>({id:uid(),label:f.label,fieldId:f.id,order:i,visible:true}))});
    }
    async function projectData() {
      const [projects,cases,fields,worksheets,rounds,attempts,evidence]=await Promise.all([
        all("projects"),byProject("cases"),byProject("fields"),byProject("worksheets"),byProject("rounds"),byProject("attempts"),byProject("evidence")
      ]);
      fields.sort((a,b)=>a.order-b.order); worksheets.sort((a,b)=>{a.columns.sort((x,y)=>x.order-y.order);return a.order-b.order;}); rounds.sort((a,b)=>a.createdAt-b.createdAt);
      return {projects,cases,fields,worksheets,rounds,attempts,evidence};
    }
    function currentRound(data) { return data.rounds.find(r=>r.id===data.settings?.currentRoundId) || data.rounds.find(r=>!r.completedAt); }
    async function render() {
      try {
        const data=await projectData(), active=data.projects.find(p=>p.id===projectId) || data.projects[0];
        if(!active) throw new Error("No project is available.");
        projectId=active.id;
        const select=$("#projectSelect"); select.innerHTML=data.projects.map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}${p.archived?" (Archived)":""}</option>`).join(""); select.value=projectId;
        const settings=(await byProject("settings")).find(x=>x.key==="current")?.value||{};
        data.settings=settings;
        const title={workspace:"Test case workspace",dashboard:"Execution dashboard",fields:"Field manager",worksheets:"Worksheet manager",history:"Execution history",settings:"Project settings"}[page];
        $("#app").innerHTML=`<div class="page-head"><div><h1>${title}</h1><p class="subtle">${escapeHtml(active.name)} · changes save automatically in this browser</p></div>${page==="workspace"?`<div class="actions"><button id="generateReport">Generate Final Report</button></div>`:""}</div>${await pageMarkup(page,data)}`;
        $$("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
        bindPage(data);
      } catch(error) { fail(error); }
    }
    async function pageMarkup(which,d) {
      if(which==="workspace") return workspaceMarkup(d);
      if(which==="dashboard") return dashboardMarkup(d);
      if(which==="fields") return fieldsMarkup(d);
      if(which==="worksheets") return sheetsMarkup(d);
      if(which==="history") return historyMarkup(d);
      return settingsMarkup(d);
    }
    function latestFor(caseId,roundId,attempts) {
      return attempts.filter(a=>a.caseId===caseId&&a.roundId===roundId).sort((a,b)=>a.at-b.at).at(-1);
    }
    function activeFields(d) { return d.fields.filter(f=>!f.archived&&f.visible!==false); }
    function editableFields(d) { return d.fields.filter(f=>!f.archived); }
    function caseStatus(c,d) {
      const r=d.rounds.find(x=>x.id===d.settings?.currentRoundId)||d.rounds.filter(x=>x.completedAt).at(-1);
      return r?latestFor(c.id,r.id,d.attempts)?.status||"Pending":"Pending";
    }
    function roundSummary(round,d) {
      const ids=round.caseIds||[], latest=ids.map(id=>latestFor(id,round.id,d.attempts)).filter(Boolean);
      const passed=latest.filter(a=>a.status==="Pass").length, failed=latest.filter(a=>a.status==="Fail").length;

    async function saveInlineCase(d) {

      if(!Object.values(values).some(value=>Array.isArray(value)?value.length>0:typeof value==="boolean"?value:String(value||"").trim().length>0)){
        notify("Enter test case details before adding a row.",true);
        return;
      }
      const missing=editableFields(d).find(field=>field.required&&field.label.toLowerCase()!=="screenshot"&&(!values[field.id]||(Array.isArray(values[field.id])&&!values[field.id].length)));
      if(missing){notify(`${missing.label} is required.`,true);$(`[data-field="${CSS.escape(missing.id)}"]`,row)?.focus();return;}
      const idField=d.fields.find(field=>field.label.toLowerCase()==="test case id");
      const caseId=String(values[idField?.id]||"").trim();
      if(idField&&d.cases.some(c=>!c.archived&&String(c.values?.[idField.id]||"").trim().toLowerCase()===caseId.toLowerCase())){
        notify("That Test Case ID already exists.",true);$(`[data-field="${CSS.escape(idField.id)}"]`,row)?.focus();return;

    function bindImageDrop(zone) {

    function clipboardEventImages(clipboardData) {

      const files=items.map((item,index)=>{
        const file=item.getAsFile?.();if(!file)return null;
        const extension=(file.type.split("/")[1]||"png").replace("jpeg","jpg");
        return new File([file],`pasted-screenshot-${Date.now()}-${index+1}.${extension}`,{type:file.type,lastModified:Date.now()});
      }).filter(Boolean);

    }
    async function readClipboardImages() {
      if(!navigator.clipboard?.read){notify("Clipboard image access is unavailable in this browser context. Copy the screenshot, click the paste area, and press Ctrl+V.",true);return;}
      try{
        const items=await navigator.clipboard.read(),files=[];
        for(const item of items)for(const type of item.types.filter(value=>value.startsWith("image/"))){
          const blob=await item.getType(type),extension=(type.split("/")[1]||"png").replace("jpeg","jpg");
          files.push(new File([blob],`pasted-screenshot-${Date.now()}-${files.length+1}.${extension}`,{type,lastModified:Date.now()}));
        }
        if(!files.length){notify("The clipboard does not contain an image. Copy a screenshot first, then try again.",true);return;}
        appendImagesToOpenDialog(files);
      }catch(error){
        console.error(error);
        notify("Could not read the clipboard. Allow clipboard access for this page, or click the paste area and press Ctrl+V.",true);
      }

    async function importWorkbook(file,d) {
      if(!window.ExcelJS){throw new Error("ExcelJS could not be loaded. Check your internet connection, then reload the application.");}
      if(!/\.xlsx$/i.test(file.name)){throw new Error("Only .xlsx workbooks are supported. Legacy .xls files are not supported.");}
      const workbook=new ExcelJS.Workbook();await workbook.xlsx.load(await file.arrayBuffer());
      if(!workbook.worksheets.length)throw new Error("The workbook contains no worksheets.");
      if(!d.cases.length&&d.worksheets.length===1&&d.worksheets[0].name==="Test Case Master"&&!d.worksheets[0].imported){await remove("worksheets",d.worksheets[0].id);d.worksheets.length=0;}
      const incomingNames=new Set(workbook.worksheets.map(s=>s.name.toLowerCase()));
      for(const existing of d.worksheets)if(!incomingNames.has(existing.name.toLowerCase())){existing.order+=workbook.worksheets.length;await put("worksheets",existing);}
      const fieldByLabel=new Map(d.fields.map(f=>[f.label.trim().toLowerCase(),f]));
      const idField=d.fields.find(f=>f.label.trim().toLowerCase()==="test case id");
      if(!idField)throw new Error("The required Test Case ID field is missing.");
      let imported=0, updated=0;
      const existingById=new Map(d.cases.map(c=>[String(c.values?.[idField.id]||"").toLowerCase(),c]));
      for(let sheetIndex=0;sheetIndex<workbook.worksheets.length;sheetIndex++){
        const sheet=workbook.worksheets[sheetIndex];
        const headers=[], headerRow=sheet.getRow(1);
        headerRow.eachCell({includeEmpty:true},(cell,col)=>{headers[col-1]=String(cell.text||cell.value||"").trim();});
        if(!headers.some(Boolean))continue;
        const columns=[];
        for(let i=0;i<headers.length;i++){
          const label=headers[i];if(!label)continue;
          let field=fieldByLabel.get(label.toLowerCase());

          columns.push({id:uid(),label,fieldId:field.id,order:i,visible:true});

        const ws=oldSheet||{id:uid(),projectId,name:sheet.name,visible:true,order:sheetIndex};
        ws.name=sheet.name;ws.columns=columns;ws.order=sheetIndex;ws.imported=true;await put("worksheets",ws);
        if(!oldSheet)d.worksheets.push(ws);
        for(let rowNumber=2;rowNumber<=sheet.rowCount;rowNumber++){
          const row=sheet.getRow(rowNumber);
          const values={};
          for(let col=0;col<columns.length;col++){
            const cell=row.getCell(columns[col].order+1);
            let value=cell.value;
            if(value&&typeof value==="object"&&"text" in value)value=value.text;
            if(value instanceof Date)value=value.toISOString().slice(0,10);
            if(value!==null&&value!==undefined)values[columns[col].fieldId]=Array.isArray(value)?value.join(", "):String(value);
          }
          if(!Object.values(values).some(v=>String(v).trim()))continue;
          if(!values[idField.id])values[idField.id]=`${sheet.name}-${rowNumber-1}`;
          const key=String(values[idField.id]).toLowerCase(), found=existingById.get(key);
          if(found){found.values={...found.values,...values};found.archived=false;await put("cases",found);updated++;}
          else{const record={id:uid(),projectId,values,createdAt:Date.now(),archived:false};existingById.set(key,record);await put("cases",record);d.cases.push(record);imported++;}
        }
      }
      notify(`Imported ${imported} new case(s), updated ${updated}, and loaded ${workbook.worksheets.length} worksheet(s).`);
      render();
    }

        if(!binary?.blob)throw new Error(`Missing screenshot data for "${evidence.originalName}". Restore a project backup or remove the broken evidence reference before generating this report.`);
        evidenceFolder.folder(folder).file(evidence.storedName,binary.blob);
        paths.set(evidence.id,path);viewerEvidence.push({...evidence,path});
      }
      const workbookBytes=await buildWorkbook(d,paths);
      zip.file("Test_Execution_Report.xlsx",workbookBytes);
      const viewerData={project,fields:d.fields.filter(f=>!f.archived),worksheets:d.worksheets,rounds:d.rounds,cases:d.cases.filter(c=>!c.archived),attempts:d.attempts,evidence:viewerEvidence};
      const worksheetPanel=`<section class="box"><h2>Configured worksheets</h2><ul>${viewerData.worksheets.map(s=>`<li><strong>${escapeHtml(s.name)}</strong> — ${escapeHtml(s.columns.filter(c=>c.visible!==false).map(c=>c.label).join(", "))}</li>`).join("")}</ul></section>`;
      zip.file("EvidenceViewer.html",makeViewer(viewerData).replace('<section class="box"><h2>Round statistics</h2>',`${worksheetPanel}<section class="box"><h2>Round statistics</h2>`));
      zip.file("README.txt",`Test Execution Manager report\n\nProject: ${project.name}\nGenerated: ${new Date().toLocaleString()}\n\nOpen EvidenceViewer.html in a modern browser to browse test cases, rounds, execution history and screenshot evidence offline. Keep the Evidence folder beside the HTML file. Open Test_Execution_Report.xlsx for the configured worksheets and complete attempt history.\n\nThe viewer does not require the application, internet access, or a server. Screenshots are referenced by relative paths within Evidence/.\n\nWorkbook generation uses ExcelJS. Imported Excel cell values, worksheet names/order, column headers and mapped data are preserved where the application supports them. Advanced Excel themes, macros, pivot tables, drawings, external links and some formula/formatting details are not preserved. Only .xlsx input is accepted.`);
      const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});
      saveBlob(blob,`${fileSlug(project.name)}_Test_Execution_Report.zip`);notify("Final report ZIP generated.");
    }
  })();
  </script>
</body>
</html>
